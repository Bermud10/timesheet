<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Табель</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
 body{font-family:system-ui,sans-serif;margin:24px;color:#222}
 .cards{display:flex;flex-wrap:wrap;gap:16px}
 .card{border:1px solid #ccc;border-radius:8px;padding:16px;min-width:220px}
 table{border-collapse:collapse;width:100%}
 td,th{border:1px solid #ddd;padding:4px 8px;font-size:14px}
 tr.weekend{background:#f5f5f5;color:#888}
 tr.holiday{background:#fff3e0}
 tr.overtime{background:#fff9c4}
 .muted{color:#888}
 input[type=time]{width:90px}
 .btn{padding:6px 12px;border:1px solid #888;border-radius:6px;background:#eee;cursor:pointer}
</style></head>
<body>
<nav><a href="{% url 'core:dashboard' %}">← Главная</a></nav>
{% if messages %}{% for m in messages %}<p style="color:green">{{ m }}</p>{% endfor %}{% endif %}
{% block content %}{% endblock %}
</body></html>
